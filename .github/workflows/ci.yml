name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Guards the promises in the README: no credential access, no shelling
      # out, no network calls, no writes into the official extension.
      - name: Compliance audit
        run: npm run audit:compliance
      - name: Build
        run: npm run build -- --production
